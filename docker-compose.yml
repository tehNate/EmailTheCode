services:
  emailthecode:
    build: .
    environment:
      EMAILTHECODE_API_KEY: change-me-to-a-long-random-token
      EMAILTHECODE_HOST: 0.0.0.0
      EMAILTHECODE_PORT: 3100
      EMAILTHECODE_LOG_FILE: /tmp/emailthecode.jsonl
      EMAILTHECODE_ALLOWED_FROM_DOMAINS: example.com
      EMAILTHECODE_SMTP_HOST: mailpit
      EMAILTHECODE_SMTP_PORT: 1025
    ports:
      - "3100:3100"
    depends_on:
      - mailpit

  # Development-only SMTP sink and web UI. Do not use in production.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
