services:
  cocomail:
    build: .
    environment:
      COCOMAIL_API_KEY: change-me-to-a-long-random-token
      COCOMAIL_HOST: 0.0.0.0
      COCOMAIL_PORT: 3100
      COCOMAIL_LOG_FILE: /tmp/cocomail.jsonl
      COCOMAIL_ALLOWED_FROM_DOMAINS: example.com
      COCOMAIL_SMTP_HOST: mailpit
      COCOMAIL_SMTP_PORT: 1025
    ports:
      - "3100:3100"
    depends_on:
      - mailpit

  # Development-only SMTP sink and web UI. Do not use in production.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
